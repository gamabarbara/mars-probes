dependencies = [
    "fastapi==0.135.1",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0.37,<3",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
