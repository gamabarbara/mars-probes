[project]
name = "mars-probes-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0.37,<3",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["httpx2", "mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
